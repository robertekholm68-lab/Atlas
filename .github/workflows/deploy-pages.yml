# Bygger och publicerar Askr till GitHub Pages automatiskt vid varje merge till
# main. Ersätter den handbyggda docs/ i repot — därför checkas ingen docs/ in
# härifrån; sajten sätts samman i CI och laddas upp som en Pages-artefakt.
#
# Adressen får INTE ändras: Android-skalet har
# robertekholm68-lab.github.io/Atlas/atlas2.html hårdkodad, så atlas2.html
# måste ligga kvar i sajtens rot.
name: Bygg och publicera till GitHub Pages

on:
  push:
    branches: [main]
  # PR:en testas FÖRE merge, inte efter. Tidigare kördes flödet bara vid push
  # till main, vilket betydde att varje PR mergades otestad av automatik och
  # rött upptäcktes först när det redan låg i main.
  #
  # Bygg-jobbet kör i sin helhet på en PR — tester, alla tre målen, hopsättning
  # och verifiering. Bara publiceringen är utelämnad: en PR får aldrig kunna
  # skriva över den publicerade sajten.
  pull_request:
    branches: [main]
  workflow_dispatch:

# actions/deploy-pages kräver pages: write + id-token: write.
permissions:
  contents: read
  pages: write
  id-token: write

# En publicering i taget. cancel-in-progress: false så en pågående deploy får
# slutföras i stället för att avbrytas halvvägs.
#
# PR-körningar får en EGEN grupp per PR. Delade de gruppen "pages" skulle en
# testkörning köa bakom en pågående publicering — och en publicering bakom ett
# testbygge. Inom en PR avbryts däremot den förra körningen när nya commits
# pushas: bara den senaste versionen är intressant.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22, inte 20: sviten (t.ex. voice.test.js) förlitar sig på den
          # globala `navigator` som bara finns i Node >= 21. Node 20 ger
          # "navigator is not defined" och stoppar en i övrigt korrekt publicering.
          # Repot utvecklas och testas på Node 22 — CI ska matcha.
          node-version: 22
          cache: npm
          cache-dependency-path: atlas-app/package-lock.json

      - name: Installera beroenden
        run: npm ci

      - name: Kontrollera att testskyddet inte krympt
        working-directory: atlas-app
        run: node scripts/kontrollera-testskydd.mjs

      - name: Lint (no-undef)
        # ENDA REGELN ÄR no-undef, och den finns av ett konkret skäl: fyra gånger
        # på tre dagar användes en identifierare utan import (volt i App2,
        # btnText i ProgramSheet, EXERCISES i App2, btnText i ProgressView).
        #
        # Varken sviten eller bygget ser det. En fri identifierare är giltig
        # JavaScript ända till körtid, så Rollup buntar utan att knota och
        # testerna monterar inte varje vy. Felet visade sig som en TOM VY i
        # webbläsaren, först när just den vyn öppnades.
        #
        # Körs före bygget: går den inte igenom är bygget meningslöst att vänta
        # på. Och den körs HÄR i stället för när någon råkar minnas
        # `npm run lint` — ett skydd som beror på att någon kommer ihåg är
        # inget skydd.
        run: npm run lint

      - name: Kör tester (rött stoppar publiceringen)
        # p5-realmode är känt instabil i full svit men grön isolerat (se
        # CLAUDE.md). En omkörning krävs så att den flakigheten inte blockerar
        # en korrekt publicering. Reruns hjälper BARA icke-deterministiska fall:
        # ett riktigt fel faller i alla tre försöken och stoppar deployen, en
        # flakig p5 rensas oftast av försök två.
        run: |
          for i in 1 2 3; do
            echo "== testförsök $i av 3 =="
            if npm test; then exit 0; fi
            echo "-- försök $i föll --"
          done
          echo "Testerna föll i tre försök i rad — det är inte flakighet. Avbryter publiceringen."
          exit 1

      - name: Bygg alla tre målen
        run: |
          npm run build                                   # desktop  -> dist/
          npx vite build --config vite.mobile.config.js   # mobil    -> dist-mobile/
          npx vite build --config vite.atlas2.config.js   # Askr 2.0 -> dist-atlas2/

      - name: Sätt samman sajten
        run: |
          set -e
          site="$GITHUB_WORKSPACE/_site"
          rm -rf "$site"; mkdir -p "$site"
          # Desktop-bygget bär receptbilderna (import.meta.glob) och alla
          # public-filer (ikoner, startsida-*, figur-*, sport-icons, TESTARE.md).
          # Dess index.html ÄR desktop-appen och ska heta app.html i sajten.
          cp -R dist/. "$site"/
          mv "$site/index.html" "$site/app.html"
          # Mobil + 2.0: egna HTML och service workers. Public-filerna dubbleras
          # men är byte-identiska, så överskrivning är ofarlig.
          cp -R dist-mobile/. "$site"/
          cp -R dist-atlas2/. "$site"/
          # Landningssidan är den riktiga startsidan — läggs SIST så den blir
          # sajtens index.html (efter att desktop-index döpts om till app.html).
          cp landing/index.html "$site/index.html"
          # Testarsidan: handbyggd fil som byggena inte producerar, kopieras rakt
          # in i sajten (samma mönster som landningssidan).
          cp landing/test.html "$site/test.html"
          # Utan .nojekyll strippar Pages filer som börjar med _ (och kan bråka
          # med andra namn). Krävs.
          touch "$site/.nojekyll"

      - name: Verifiera hopsättningen
        run: |
          set -e
          site="$GITHUB_WORKSPACE/_site"
          # Adressen får inte ändras: atlas2.html i roten.
          for f in atlas2.html app.html mobile.html index.html test.html sw.js sw-atlas2.js atlas2.webmanifest .nojekyll; do
            test -f "$site/$f" || { echo "FEL: $f saknas i sajten"; exit 1; }
          done
          # Receptbilderna ska vara 134 (samma som källorna i src/assets/recipes).
          # Färre betyder att import.meta.glob missat filer — stoppa hellre än
          # att publicera en app med tomma tallrikar.
          n=$(find "$site" -maxdepth 1 -type f \( -name 'g_*.webp' -o -name 'r_*.webp' \) | wc -l)
          echo "Receptbilder i sajten: $n (förväntat 134)"
          test "$n" -eq 134 || { echo "FEL: fel antal receptbilder ($n != 134) — import.meta.glob har troligen missat filer"; exit 1; }
          # Varje bild som sidorna PEKAR PÅ måste också finnas. Listan härleds ur
          # HTML:en i stället för att skrivas för hand — en handskriven lista
          # driver isär från verkligheten, och det är just den sortens fel som
          # ska fångas. Utan det här steget kan en raderad public/-fil
          # publiceras som en trasig bild eller en 404-favicon utan att något
          # larmar (hände när askr-mark.* togs bort).
          saknas=0
          for html in "$site"/index.html "$site"/test.html "$site"/atlas2.html; do
            test -f "$html" || continue
            for ref in $(grep -ohE '(href|src)="\./[^"]+\.(webp|png|jpg|json)"' "$html" \
                         | sed -E 's/.*"\.\/([^"]+)".*/\1/' | sort -u); do
              if [ ! -f "$site/$ref" ]; then
                echo "FEL: $(basename "$html") pekar på $ref som inte finns i sajten"
                saknas=1
              fi
            done
          done
          test "$saknas" -eq 0 || { echo "Publicering stoppad: brutna bildreferenser."; exit 1; }
          echo "Alla bildreferenser i sidorna finns i sajten."

      # Artefakten laddas bara upp för riktiga publiceringar. En PR-körning har
      # redan gjort sitt jobb när hopsättningen verifierats — det som ligger
      # kvar i _site kastas med körningen.
      - name: Ladda upp Pages-artefakt
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # ── DOM-VERIFIERING ────────────────────────────────────────────────────
  #
  # De tio skripten mäter layout, sidscroll och funktion i en RIKTIG webbläsare.
  # De har fångat sådant som varken sviten eller bygget ser: passvyn låg 107 px
  # utanför skärmkanten på 375 px, och en bild renderades men laddades aldrig
  # (naturalWidth 0). Båda hade gått rakt igenom en grön svit.
  #
  # EGET JOBB, INTE FLER STEG I `build`. Sekventiellt tar de 374 s (mätt), och
  # det hade lagts rakt på varje publicering. Skripten binder tio OLIKA portar
  # (8931–8963) och kan därför köras parallellt — en matris ger väggklocka lika
  # med det längsta skriptet (63 s) plus uppsättning, i stället för summan.
  #
  # fail-fast: false — faller ett skript vill vi se de nio andras utfall också.
  # Ett halvt facit gör felsökningen till gissning.
  verifiera-dom:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas-app
    strategy:
      fail-fast: false
      matrix:
        skript:
          - verify-atlas2.mjs
          - verify-atlas2-backup.mjs
          - verify-atlas2-layout.mjs
          - verify-atlas2-matakut.mjs
          - verify-atlas2-mealprep.mjs
          - verify-atlas2-pass.mjs
          - verify-atlas2-passredigering.mjs
          - verify-atlas2-readiness.mjs
          - verify-atlas2-sport.mjs
          - verify-atlas2-tillskott.mjs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: atlas-app/package-lock.json

      - name: Installera beroenden
        run: npm ci

      - name: playwright-core
        # Medvetet --no-save: skripten är verktyg, inte en del av appen, och
        # playwright hör inte hemma i det som byggs. Samma rad står överst i
        # varje skript.
        run: npm i --no-save playwright-core

      - name: Bygg Askr 2.0
        # Alla tio kör mot dist-atlas2 över http. file:// gör localStorage
        # opålitligt och blockerar service workern.
        run: npx vite build --config vite.atlas2.config.js

      - name: Peka ut webbläsaren
        # Skripten letar via chromiumBin(): PW_CHROMIUM först, sedan raka
        # sökvägar. GitHubs ubuntu-avbild har Chrome förinstallerad, så ingen
        # nedladdning behövs — men om avbilden ändras ska det falla HÄR med ett
        # begripligt fel, inte inne i ett skript som "hittar ingen Chromium".
        run: |
          test -x /usr/bin/google-chrome || {
            echo "FEL: /usr/bin/google-chrome saknas i körarens avbild."
            echo "Åtgärd: byt till 'npx --yes playwright install chromium' och"
            echo "sätt PW_CHROMIUM till den nedladdade binären."
            exit 1
          }
          /usr/bin/google-chrome --version

      - name: ${{ matrix.skript }}
        env:
          PW_CHROMIUM: /usr/bin/google-chrome
        run: node scripts/${{ matrix.skript }}

  deploy:
    # Publiceringen väntar på BÅDA. Ett grönt bygge med en trasig vy är precis
    # det de tio skripten finns för att stoppa.
    needs: [build, verifiera-dom]
    # SPÄRREN. Utan den hade en PR publicerat sin egen kod till den adress
    # Android-skalet pekar på.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicera till GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
